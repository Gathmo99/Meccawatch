name: MECCHA ROGUE Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - watcher.py
      - requirements.txt
      - tests/**
      - .github/workflows/watcher.yml

permissions:
  contents: write

concurrency:
  group: meccha-rogue-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Watch facility
        id: watcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python watcher.py

      - name: Commit detected changes
        env:
          COMMIT_MESSAGE: ${{ steps.watcher.outputs.commit_message }}
        run: |
          git config user.name "ARGUS Watcher"
          git config user.email "argus-watcher@users.noreply.github.com"
          git add snapshot.html state.json snapshots history artifacts
          if git diff --cached --quiet; then
            echo "No tracked website changes."
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE:-A.R.G.U.S. website change detected}"
          git push
